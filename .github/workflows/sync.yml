name: Sincronizar Fork

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta automáticamente todos los días a la medianoche
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar mi repositorio (Fork)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # Descarga todo el historial para evitar errores de Git

      - name: Forzar actualización desde el original
        run: |
          # Configurar la identidad obligatoria de Git para evitar el error 128
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Añadir el repositorio original como fuente remota
          git remote add upstream https://github.com
          git fetch upstream
          
          # Detectar de forma automática si ellos usan master o main y sobrescribir tu main
          if git rev-parse --verify upstream/master >/dev/null 2>&1; then
            git reset --hard upstream/master
          else
            git reset --hard upstream/main
          fi
          
          # Forzar la subida de los datos limpios a tu repositorio
          git push origin main --force
