name: Sincronizar Fork

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta automáticamente todos los días a la medianoche
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar mi repositorio (Fork)
        uses: actions/checkout@v4
        with:
          ref: main # Descarga tu rama principal para tener el entorno git listo

      - name: Forzar actualización desde el original
        run: |
          # Añade el repositorio original como fuente remota remota
          git remote add upstream https://github.com
          
          # Descarga los cambios reales de su rama por defecto (sea master o main)
          git fetch upstream
          
          # Sobrescribe tu rama main con el contenido exacto del creador original
          # Detecta automáticamente si ellos usan master o main
          if git rev-parse --verify upstream/master >/dev/null 2>&1; then
            git reset --hard upstream/master
          else
            git reset --hard upstream/main
          fi
          
          # Sube los cambios limpios a tu GitHub
          git push origin main --force
