name: Sincronizar Fork

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta automáticamente todos los días a la medianoche
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sincronizar usando GitHub CLI Oficial
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Sincroniza la rama de forma remota y segura usando la API oficial
          gh repo sync ${{ github.repository }} --branch main --force
