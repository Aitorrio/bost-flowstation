name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# Only the latest run per branch/PR needs to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build · test · clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # soapysdr-sys links against the system SoapySDR library (pkg-config SoapySDR.pc);
      # without it the whole workspace build fails before anything else runs.
      - name: Install SoapySDR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsoapysdr-dev

      - name: Install Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # The default feature set, matching `cargo build --workspace` in CLAUDE.md.
      # The `asterisk` feature is intentionally not built here: it links against the
      # native tetra-codec shared library, which the runner does not carry.
      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --no-fail-fast

      # The workspace Clippy policy (Cargo.toml) already allows the pedantic/style lints
      # this codebase has chosen not to enforce, so -D warnings catches only real issues.
      # rustfmt is not checked here: the tree is deliberately not rustfmt-clean, so the
      # pre-commit hook checks only touched files instead.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
