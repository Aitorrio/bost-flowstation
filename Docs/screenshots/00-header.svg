<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-label="Bost FlowStation">
  <title>Bost FlowStation</title>
  <!-- Centered brand lockup: dashboard antenna mark + product name -->
  <rect width="720" height="240" fill="#ffffff"/>

  <!-- Icon plate -->
  <defs>
    <linearGradient id="plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00876a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1565c0" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <rect x="312" y="28" width="96" height="96" rx="18" fill="url(#plate)" stroke="#00876a" stroke-opacity="0.30" stroke-width="1.5"/>

  <!-- Antenna (same geometry as login/sidebar, scaled into the plate) -->
  <g transform="translate(328 44) scale(2)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#00d4a8" stroke-width="2">
      <path d="M14 28 L16 8 L18 28"/>
      <line x1="14.6" y1="22" x2="17.4" y2="22"/>
      <line x1="14.9" y1="17" x2="17.1" y2="17"/>
      <line x1="15.2" y1="13" x2="16.8" y2="13"/>
      <line x1="16" y1="8" x2="16" y2="4"/>
      <circle cx="16" cy="3" r="1" fill="#00d4a8" stroke="none"/>
    </g>
    <g stroke="#4da6ff" stroke-width="2">
      <path d="M9 8 Q6 11 6 16" opacity="0.7"/>
      <path d="M23 8 Q26 11 26 16" opacity="0.7"/>
      <path d="M11 6 Q7 9 7 14" opacity="0.4"/>
      <path d="M21 6 Q25 9 25 14" opacity="0.4"/>
    </g>
  </g>

  <!-- Product name -->
  <text x="360" y="180" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="700" fill="#0f172a">Bost FlowStation</text>
  <rect x="300" y="196" width="120" height="4" rx="2" fill="#00d4a8"/>
</svg>
