# Bost FlowStation — Wi-Fi resilience defaults for Raspberry Pi / NetworkManager.
# Installed to /etc/NetworkManager/conf.d/bost-wifi.conf by install-bost.sh.
#
# wifi.powersave=2  → disable power save (2). RPi wireless chips often drop
#                      association when powersave is enabled.
# mac-address-randomization=never → stable MAC for DHCP reservation / AP ACLs.
#
# Verify after reload:
#   nmcli general
#   iw dev wlan0 get power_save
#   nmcli -f connection.autoconnect,802-11-wireless.powersave c show <ssid>

[connection]
wifi.powersave=2

[device-wifi]
wifi.scan-rand-mac-address=no
